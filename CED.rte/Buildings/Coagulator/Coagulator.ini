	SpriteFile = ContentFile
		FilePath = CED.rte/Buildings/Coagulator/Coagulator.png
	FrameCount = 1
	SpriteOffset = Vector
		X = -50
		Y = -50
	SpriteAnimMode = 0
	SpriteAnimDuration = 0
	// Unfortunately, due to how item creation works, we need the name of the item, ClassName of the item (like HDFirearm, AHuman, etc), AND TechName, like Browncoats.rte, Coalition.rte, etc.
	AddCustomValue = StringValue
		BuiltEntityPresetName = Atmospheric Coagulator
	AddCustomValue = StringValue
		BuiltEntityClassName = MOSRotating
	AddCustomValue = StringValue
		BuiltEntityTechName = CED.rte
