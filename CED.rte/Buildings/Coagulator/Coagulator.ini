		BuildPointRequirement = 150
	AddCustomValue = NumberValue // Whether this auto-builds or not.
		AutoBuild = 0
	AddCustomValue = NumberValue // Auto-build rate per second.
		AutoBuildRate = 0
	AtomGroup = AtomGroup
		AutoGenerate = 1

