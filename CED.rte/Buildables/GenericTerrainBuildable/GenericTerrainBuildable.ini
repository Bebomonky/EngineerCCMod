		Y = -19
	SpriteAnimMode = 0
	SpriteAnimDuration = 0
	ScriptPath = CED.rte/Buildables/GenericTerrainBuildable/GenericTerrainBuildable.lua
	// Unfortunately, due to how item creation works, we need the name of the item, ClassName of the item (like HDFirearm, AHuman, etc), AND TechName, like Browncoats.rte, Coalition.rte, etc.
	AddCustomValue = StringValue // Don't add a space to the end of the name here, the script does it automatically between the name and number.
		ChunkPresetName = CED Generic Terrain Buildable Chunk
	AddCustomValue = StringValue // This realistically won't be anything other than a MOSRotating.
		ChunkClassName = MOSRotating
	AddCustomValue = StringValue
		ChunkTechName = CED.rte
	AddCustomValue = NumberValue // Number of chunks. Starts at 1, so "4" would search for ChunkPresetName 1, 2, 3, 4.
		ChunkCount = 3
	AddCustomValue = NumberValue // Build points needed to finish.
		BuildPointRequirement = 100
	AddCustomValue = NumberValue // Whether this auto-builds or not.
		AutoBuild = 0
	AddCustomValue = NumberValue // Auto-build rate per second.
		AutoBuildRate = 0
	AtomGroup = AtomGroup
		AutoGenerate = 1