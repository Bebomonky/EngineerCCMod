		AddLine = The construction of this ballistic shield isn't exactly groundbreaking, but in response to the increasingly close-quarters combat of today's space warfare, Khrabarovsk has given the Khuligan a build and a handle both fit for using it not just defensively, but offensively as well. Outright swinging it isn't very possible, but during a sprint or jetpack maneuver it can easily be positioned to brutalize anything in its way. Just don't get it shot up too much on the way.
