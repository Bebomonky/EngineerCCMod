	PresetName = Khrabarovsk GS7
	AddToGroup = Weapons
	AddToGroup = Weapons - Primary
	AddToGroup = Weapons - CQB
	AddToGroup = Weapons - Light
	Description = MultiLineText
		AddLine = Khrabarovsk-brand pump shotgun. The CQB weapon of choice since time immemorial. Use the Primary Ability Hotkey (default V) to switch to slam-firing, drastically increasing fire rate at an equal cost to accuracy.
		AddLine = 
		AddLine = Most companies move away from loose exploitable mechanical designs, call it "improved materials technology", and charge you more. Khrabarovsk has done the opposite. Downgrading from carbon steel to pig iron allows not only for the GS7 to be a dirt cheap buckshot solution but also for the tolerances to be so high that most of the gun can be fixed with clever use of a sledgehammer - furthermore, the trigger mechanism is primitive enough that slam-firing will work, and will fire the gun. When you're panicking and want the angry thing in front of you gone in a shower of lead, you'll be really glad this thing is a piece of junk.
